<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Menú</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main id="menu-content"></main>

  <div id="site-footer-mount"></div>

  <!-- Barra flotante del carrito (móvil) -->
  <button class="floating-cart-bar" id="floating-cart-bar" type="button">
    <span class="count" id="floating-count">0 items</span>
    <span class="amount" id="floating-amount">¥0</span>
  </button>

  <!-- Drawer del carrito -->
  <div class="overlay" id="cart-overlay"></div>
  <aside class="drawer" id="cart-drawer" aria-label="Carrito de compras">
    <div class="drawer-header">
      <h2 id="cart-drawer-title">Tu pedido</h2>
      <button class="drawer-close" id="close-cart-btn" type="button">✕</button>
    </div>
    <div class="drawer-body" id="cart-body"></div>
    <div class="drawer-footer">
      <div class="total-row">
        <span id="cart-total-label">Total</span>
        <span class="amount" id="cart-total">¥0</span>
      </div>
      <button class="primary-btn" id="checkout-btn" type="button">Continuar pedido</button>
    </div>
  </aside>

  <!-- Gate de bienvenida: ¿está en el restaurante o quiere reservar? -->
  <div class="modal-overlay" id="gate-modal">
    <div class="modal-box">
      <h2 id="gate-title">Bienvenido a Boogaloo</h2>
      <p class="subt" id="gate-subtitle">¿Qué quieres hacer?</p>
      <button class="primary-btn" id="gate-dine-in-btn" type="button" style="width:100%; margin-bottom:10px;">Estoy en el restaurante</button>
      <button class="ghost-btn" id="gate-reserve-btn" type="button" style="width:100%;">Hacer una reserva</button>
    </div>
  </div>

  <!-- Modal de cuenta / checkout -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal-box">
      <div id="account-modal-body"></div>
    </div>
  </div>

  <!-- Modal de seguimiento de mis pedidos -->
  <div class="modal-overlay" id="orders-modal">
    <div class="modal-box">
      <div id="orders-modal-body"></div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
