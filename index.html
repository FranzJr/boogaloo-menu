<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Menú</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="flag-stripe"></div>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <h1>Boogaloo</h1>
          <p>コロンビア料理 · Comida Colombiana</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="account-pill" id="account-pill" type="button">Invitado</button>
        <button class="cart-btn my-orders-btn" id="my-orders-btn" type="button" style="display:none;">
          <span class="icon-receipt" aria-hidden="true"></span>
          <span>Mis pedidos</span>
          <span class="badge" id="my-orders-badge" style="display:none;">0</span>
        </button>
        <button class="cart-btn" id="open-cart-btn" type="button">
          <span class="icon-cart" aria-hidden="true"></span>
          <span>Carrito</span>
          <span class="badge" id="cart-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>
    <nav class="cat-nav" id="cat-nav"></nav>
  </header>

  <main id="menu-content"></main>

  <footer class="site-footer">
    Boogaloo · Menú digital · Los precios incluyen impuestos (税込)
  </footer>

  <!-- Barra flotante del carrito (móvil) -->
  <button class="floating-cart-bar" id="floating-cart-bar" type="button">
    <span class="count" id="floating-count">0 items</span>
    <span class="amount" id="floating-amount">¥0</span>
  </button>

  <!-- Drawer del carrito -->
  <div class="overlay" id="cart-overlay"></div>
  <aside class="drawer" id="cart-drawer" aria-label="Carrito de compras">
    <div class="drawer-header">
      <h2>Tu pedido</h2>
      <button class="drawer-close" id="close-cart-btn" type="button">✕</button>
    </div>
    <div class="drawer-body" id="cart-body"></div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Total</span>
        <span class="amount" id="cart-total">¥0</span>
      </div>
      <button class="primary-btn" id="checkout-btn" type="button">Continuar pedido</button>
    </div>
  </aside>

  <!-- Modal de cuenta / checkout -->
  <div class="modal-overlay" id="account-modal">
    <div class="modal-box">
      <div id="account-modal-body"></div>
    </div>
  </div>

  <!-- Modal de seguimiento de mis pedidos -->
  <div class="modal-overlay" id="orders-modal">
    <div class="modal-box">
      <div id="orders-modal-body"></div>
    </div>
  </div>

  <script src="js/menu-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
