<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Blog</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="ab-wrap">
    <section class="ab-section blog-hero" data-reveal>
      <h2 id="blog-hero-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/salento-cocora.jpg" alt="Valle de Cocora, Salento, Quindío, Colombia" />
        <figcaption>Foto: <a href="https://unsplash.com/@jankronies" target="_blank" rel="noopener">Jan Kronies</a> / Unsplash</figcaption>
      </figure>
    </section>

    <article class="ab-section blog-article blog-article-blue" data-reveal>
      <h2 id="blog-story1-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/toyota-land-cruiser.jpg" alt="Toyota Land Cruiser antiguo en un valle de montaña" />
        <figcaption>Foto: <a href="https://www.pexels.com/@mohammad-hassaan-1010671" target="_blank" rel="noopener">Mohammad Hassaan</a> / Pexels</figcaption>
      </figure>
      <div id="blog-story1-body"></div>
    </article>

    <article class="ab-section blog-article blog-article-yellow" data-reveal>
      <h2 id="blog-story2-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/dominos-mesa.jpg" alt="Dos personas jugando dominó en una mesa al aire libre" />
        <figcaption>Foto: <a href="https://www.pexels.com/@kampus" target="_blank" rel="noopener">Kampus Production</a> / Pexels</figcaption>
      </figure>
      <div id="blog-story2-body"></div>
    </article>

    <article class="ab-section blog-article blog-article-green" data-reveal>
      <h2 id="blog-story3-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/panela-trapiche.jpg" alt="Elaboración artesanal de panela, vertiendo la miel de caña en un molde" />
        <figcaption>Foto: <a href="https://www.pexels.com/@drphotographer152" target="_blank" rel="noopener">Dr Photographer</a> / Pexels</figcaption>
      </figure>
      <div id="blog-story3-body"></div>
    </article>
  </main>

  <div id="site-footer-mount"></div>

  <script src="js/i18n.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
