<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Blog</title>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Boogaloo" />
<meta property="og:title" content="Boogaloo — Blog" />
<meta property="og:description" content="Historias que conectan Colombia y Japón, desde Nagoya." />
<meta property="og:image" content="https://boogaloo.cafe/img/blog/salento-cocora.jpg" />
<meta property="og:url" content="https://boogaloo.cafe/blog.html" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="ab-wrap">
    <section class="ab-section blog-hero" data-reveal>
      <h2 id="blog-hero-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/salento-cocora.jpg" alt="Valle de Cocora, Salento, Quindío, Colombia" />
        <figcaption>Foto: <a href="https://unsplash.com/@jankronies" target="_blank" rel="noopener">Jan Kronies</a> / Unsplash</figcaption>
      </figure>
    </section>

    <div id="blog-posts-mount"></div>
    <div id="blog-load-sentinel"></div>
  </main>

  <div class="modal-overlay" id="share-modal">
    <div class="modal-box">
      <div id="share-modal-body"></div>
    </div>
  </div>

  <div id="site-footer-mount"></div>

  <script src="js/i18n.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
