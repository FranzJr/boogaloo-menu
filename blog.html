<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Blog</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="ab-wrap">
    <section class="ab-section blog-hero" data-reveal>
      <h2 id="blog-hero-title"></h2>
      <figure class="blog-hero-figure">
        <img src="img/blog/salento-cocora.jpg" alt="Valle de Cocora, Salento, Quindío, Colombia" />
        <figcaption>Foto: <a href="https://unsplash.com/@jankronies" target="_blank" rel="noopener">Jan Kronies</a> / Unsplash</figcaption>
      </figure>
    </section>

    <article class="ab-section blog-post blog-post-red" data-reveal>
      <h2 id="blog-story1-title" class="blog-post-title"></h2>
      <p class="blog-byline" id="blog-story1-byline"></p>
      <figure class="blog-post-figure">
        <img src="img/blog/tolima-valle.jpg" alt="Valle visto desde una montaña del Tolima, Colombia" />
      </figure>
      <div class="blog-post-body" id="blog-story1-body"></div>
    </article>

    <article class="ab-section blog-post blog-post-blue" data-reveal>
      <h2 id="blog-story2-title" class="blog-post-title"></h2>
      <p class="blog-byline" id="blog-story2-byline"></p>
      <figure class="blog-post-figure">
        <img src="img/blog/tolima-mirador.jpg" alt="Mirador con mesa y sillas en las montañas del Tolima, Colombia" />
      </figure>
      <div class="blog-post-body" id="blog-story2-body"></div>
    </article>

    <article class="ab-section blog-post blog-post-gold" data-reveal>
      <h2 id="blog-story3-title" class="blog-post-title"></h2>
      <p class="blog-byline" id="blog-story3-byline"></p>
      <figure class="blog-post-figure">
        <img src="img/blog/tolima-arcoiris.jpg" alt="Arcoíris sobre las montañas verdes del Tolima, Colombia" />
      </figure>
      <div class="blog-post-body" id="blog-story3-body"></div>
    </article>
  </main>

  <div id="site-footer-mount"></div>

  <script src="js/i18n.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/blog.js"></script>
</body>
</html>
