<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Panel de pedidos</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="flag-stripe"></div>

  <!-- Vista de login -->
  <div class="admin-login-box" id="login-view">
    <span id="admin-lang-slot" style="float:right;"></span>
    <h1 id="admin-panel-title">Panel Boogaloo</h1>
    <p class="subt" id="admin-login-sub">Ingresa con tu usuario y clave de administrador</p>
    <div class="form-error" id="login-error"></div>
    <div class="field"><label id="admin-usuario-label">Usuario</label><input id="login-usuario" type="text" autocomplete="username" /></div>
    <div class="field"><label id="admin-clave-label">Clave</label><input id="login-clave" type="password" autocomplete="current-password" /></div>
    <button class="primary-btn" id="login-btn" type="button" style="width:100%;">Ingresar</button>
  </div>

  <!-- Vista del hub: elegir sección (Pedidos, Turnos...) -->
  <div class="admin-login-box" id="hub-view" style="display:none;">
    <span id="hub-lang-slot" style="float:right;"></span>
    <h1 id="hub-title">Panel Boogaloo</h1>
    <p class="subt" id="hub-subtitle">Elige una sección</p>
    <button class="primary-btn" id="hub-pedidos-btn" type="button" style="width:100%; margin-bottom:10px;">Pedidos</button>
    <button class="primary-btn" id="hub-turnos-btn" type="button" style="width:100%; margin-bottom:10px;">Turnos</button>
    <button class="primary-btn" id="hub-reservas-btn" type="button" style="width:100%; margin-bottom:10px;">Reservas</button>
    <span class="who" id="hub-who-label" style="display:block; margin-top:14px;"></span>
    <button class="link-btn" id="hub-logout-btn" type="button">Cerrar sesión</button>
  </div>

  <!-- Vista del panel -->
  <div class="admin-shell" id="panel-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-orders-title">Pedidos</h1>
        <div>
          <span id="panel-lang-slot"></span>
          <button class="link-btn" id="back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="who-label"></span>
          <button class="link-btn" id="logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>

      <div class="filter-row" id="filter-row">
        <button data-filter="activos" class="active" type="button">En curso</button>
        <button data-filter="cobrados" type="button">Cobrados</button>
        <button data-filter="todos" type="button">Todos</button>
        <button id="refresh-btn" type="button" style="margin-left:auto;">↻ Actualizar</button>
      </div>
    </div>

    <div id="orders-list"></div>
  </div>

  <!-- Vista de reservas -->
  <div class="admin-shell" id="reservas-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-reservas-title">Reservas</h1>
        <div>
          <span id="reservas-lang-slot"></span>
          <button class="link-btn" id="reservas-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="reservas-who-label"></span>
          <button class="link-btn" id="reservas-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>

      <div class="filter-row" id="reservas-filter-row">
        <button data-rfilter="pendientes" class="active" type="button">Pendientes</button>
        <button data-rfilter="revision" type="button">Fuera de horario</button>
        <button data-rfilter="confirmadas" type="button">Confirmadas</button>
        <button data-rfilter="todas" type="button">Todas</button>
        <button id="reservas-refresh-btn" type="button" style="margin-left:auto;">↻ Actualizar</button>
      </div>
    </div>

    <div id="reservas-list"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
