<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!-- Google Tag Manager -->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Boogaloo — Panel de pedidos</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TD4LF6K3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <div class="flag-stripe"></div>
  <div id="site-nav-mount"></div>

  <!-- Vista de login -->
  <div class="admin-login-box" id="login-view">
    <span id="admin-lang-slot" style="float:right;"></span>
    <h1 id="admin-panel-title">Panel Boogaloo</h1>
    <p class="subt" id="admin-login-sub">Ingresa con tu usuario y clave de administrador</p>
    <div class="form-error" id="login-error"></div>
    <div class="field"><label id="admin-usuario-label">Usuario</label><input id="login-usuario" type="text" autocomplete="username" /></div>
    <div class="field"><label id="admin-clave-label">Clave</label><input id="login-clave" type="password" autocomplete="current-password" /></div>
    <button class="primary-btn" id="login-btn" type="button" style="width:100%;">Ingresar</button>
  </div>

  <!-- Vista del hub: elegir sección (Pedidos, Turnos...) -->
  <div class="admin-login-box" id="hub-view" style="display:none;">
    <span id="hub-lang-slot" style="float:right;"></span>
    <h1 id="hub-title">Panel Boogaloo</h1>
    <p class="subt" id="hub-subtitle">Elige una sección</p>
    <button class="primary-btn" id="hub-pedidos-btn" type="button" style="width:100%; margin-bottom:10px;">Pedidos</button>
    <button class="primary-btn" id="hub-turnos-btn" type="button" style="width:100%; margin-bottom:10px;">Turnos</button>
    <button class="primary-btn" id="hub-reservas-btn" type="button" style="width:100%; margin-bottom:10px;">Reservas</button>
    <button class="primary-btn" id="hub-menu-btn" type="button" style="width:100%; margin-bottom:10px;">Menú</button>
    <button class="primary-btn" id="hub-eventos-btn" type="button" style="width:100%; margin-bottom:10px;">Eventos</button>
    <button class="primary-btn" id="hub-inventario-btn" type="button" style="width:100%; margin-bottom:10px;">Inventario</button>
    <button class="primary-btn" id="hub-analytics-btn" type="button" style="width:100%; margin-bottom:10px;">Analítica</button>
    <span class="who" id="hub-who-label" style="display:block; margin-top:14px;"></span>
    <button class="link-btn" id="hub-logout-btn" type="button">Cerrar sesión</button>
  </div>

  <!-- Vista del panel -->
  <div class="admin-shell" id="panel-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-orders-title">Pedidos</h1>
        <div>
          <span id="panel-lang-slot"></span>
          <button class="link-btn" id="back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="who-label"></span>
          <button class="link-btn" id="logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>

      <div class="filter-row" id="filter-row">
        <button data-filter="activos" class="active" type="button">En curso</button>
        <button data-filter="cobrados" type="button">Cobrados</button>
        <button data-filter="todos" type="button">Todos</button>
        <button id="new-order-btn" type="button" style="margin-left:auto;"></button>
        <button id="refresh-btn" type="button">↻ Actualizar</button>
      </div>
    </div>

    <div id="orders-list"></div>
  </div>

  <!-- Modal: crear pedido manual para un cliente (no se mezcla con otros pedidos) -->
  <div class="modal-overlay" id="new-order-modal">
    <div class="modal-box">
      <div id="new-order-modal-body"></div>
    </div>
  </div>

  <!-- Vista de gestión del menú: marcar productos agotados -->
  <div class="admin-shell" id="menu-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-menu-title">Menú</h1>
        <div>
          <span id="menu-lang-slot"></span>
          <button class="link-btn" id="menu-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="menu-who-label"></span>
          <button class="link-btn" id="menu-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>
    </div>
    <div class="tn-panel" id="site-config" style="display:none; margin-top:14px;">
      <label style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="cfg-ship-banner" /> <span id="cfg-ship-banner-label"></span>
      </label>
      <p class="subt" id="cfg-saved" style="margin:6px 0 0;"></p>
    </div>
    <div id="menu-admin-list"></div>
  </div>

  <!-- Vista de inventario: insumos y stock -->
  <div class="admin-shell" id="inventario-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-inventario-title">Inventario</h1>
        <div>
          <span id="inventario-lang-slot"></span>
          <button class="link-btn" id="inventario-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="inventario-who-label"></span>
          <button class="link-btn" id="inventario-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>
      <div class="order-add-item" data-order-add>
        <input type="text" id="insumo-nombre" class="order-add-select" />
        <input type="text" id="insumo-unidad" class="order-add-qty" style="width:90px;" />
        <button class="ghost-btn" id="insumo-add-btn" type="button"></button>
      </div>
    </div>
    <div id="insumos-list"></div>
  </div>

  <!-- Modal: receta de un producto (qué insumos y cuánto consume) -->
  <div class="modal-overlay" id="receta-modal">
    <div class="modal-box">
      <div id="receta-modal-body"></div>
    </div>
  </div>

  <!-- Vista de inscripciones a eventos -->
  <div class="admin-shell" id="inscripciones-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-inscripciones-title">Eventos</h1>
        <div>
          <span id="inscripciones-lang-slot"></span>
          <button class="link-btn" id="inscripciones-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="inscripciones-who-label"></span>
          <button class="link-btn" id="inscripciones-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>
    </div>
    <div id="inscripciones-list"></div>
  </div>

  <!-- Vista de reservas -->
  <div class="admin-shell" id="reservas-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1 id="admin-reservas-title">Reservas</h1>
        <div>
          <span id="reservas-lang-slot"></span>
          <button class="link-btn" id="reservas-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="reservas-who-label"></span>
          <button class="link-btn" id="reservas-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>

      <div class="filter-row" id="reservas-filter-row">
        <button data-rfilter="pendientes" class="active" type="button">Pendientes</button>
        <button data-rfilter="revision" type="button">Fuera de horario</button>
        <button data-rfilter="confirmadas" type="button">Confirmadas</button>
        <button data-rfilter="todas" type="button">Todas</button>
        <button id="reservas-refresh-btn" type="button" style="margin-left:auto;">↻ Actualizar</button>
      </div>
    </div>

    <details class="tn-panel" id="horario-panel" style="margin-top:14px;">
      <summary id="horario-title">Horario del negocio</summary>
      <div id="horario-body" style="margin-top:10px;"></div>
    </details>

    <div id="reservas-list"></div>
  </div>

  <!-- Vista de Analítica — datos reales de la hoja Visitas (ver js/track.js) -->
  <div class="admin-shell" id="analytics-view" style="display:none;">
    <div class="admin-sticky-top">
      <div class="admin-topbar">
        <h1><span id="analytics-title">Analítica</span></h1>
        <div>
          <span id="analytics-lang-slot"></span>
          <button class="link-btn" id="analytics-back-to-hub-btn" type="button">← Volver</button>
          <span class="who" id="analytics-who-label"></span>
          <button class="link-btn" id="analytics-logout-btn" type="button">Cerrar sesión</button>
        </div>
      </div>
    </div>

    <p class="subt" id="an-status"></p>
    <button class="ghost-btn" id="analytics-regenerate-btn" type="button" style="margin-bottom:18px;"></button>

    <div class="tn-stats" id="an-kpis"></div>

    <div class="an-grid">
      <div class="an-card an-card-wide">
        <h3 id="an-trend-title"></h3>
        <div id="an-trend-chart"></div>
      </div>
      <div class="an-card">
        <h3 id="an-bypage-title"></h3>
        <div id="an-bypage-chart"></div>
      </div>
      <div class="an-card">
        <h3 id="an-device-title"></h3>
        <div id="an-device-chart"></div>
      </div>
      <div class="an-card">
        <h3 id="an-funnel-title"></h3>
        <div id="an-funnel-chart"></div>
      </div>
      <div class="an-card an-card-wide">
        <h3 id="an-hours-title"></h3>
        <div id="an-hours-chart"></div>
      </div>
      <div class="an-card">
        <h3 id="an-sources-title"></h3>
        <div id="an-sources-chart"></div>
      </div>
      <div class="an-card">
        <h3 id="an-languages-title"></h3>
        <div id="an-languages-chart"></div>
      </div>
    </div>

    <div class="an-card">
      <h3 id="an-recommendations-title"></h3>
      <div id="an-recommendations"></div>
    </div>

    <div class="an-card">
      <h3 id="an-visitors-title"></h3>
      <div style="overflow-x:auto;">
        <table class="an-table" id="an-visitors-table"></table>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/analytics-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
